name: Integrar Controle de Estudos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-study.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar scripts do Controle de Estudos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tags=[('study.js','31'),('study-open-fix.js','31'),('study-cycle-plan.js','31')]
          for name,v in tags:
              tag=f'<script src="{name}?v={v}"></script>'
              s=re.sub(r'<script src="'+re.escape(name)+r'\?v=\d+"></script>',tag,s)
              if name not in s:s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Atualização 03: publica aulas dentro dos blocos com progresso persistente"
          git push
