name: Integrar Ciclo de Estudos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-study.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar Ciclo sem alterar o JavaScript principal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ['study.js','study-open-fix.js','study-cycle-plan.js']:
              s=re.sub(r'<script\s+src=["\']'+re.escape(name)+r'(?:\?[^"\']*)?["\']\s*></script>','',s,flags=re.I)
          tags='\n<script src="study.js?v=40"></script>\n<script src="study-open-fix.js?v=40"></script>\n<script src="study-cycle-plan.js?v=40"></script>\n'
          s=s.replace('</body>',tags+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificações estruturais
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function init()' in s
          assert 'function render(' in s
          assert 'function ans(' in s
          assert 'function tab(' in s
          assert 'questoes.json' in s
          assert s.count('study.js?v=40') == 1
          assert s.count('study-open-fix.js?v=40') == 1
          assert s.count('study-cycle-plan.js?v=40') == 1
          assert s.count('</body>') == 1
          assert s.count('</html>') == 1
          print('Auditoria estrutural OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Correção v40: restaura Ciclo com integração isolada"
          git push
