name: Auditar banco SEFAZ-AL v32
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-question-bank.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar e selecionar 6000
        run: python scripts/recuperar_questoes_v32.py
      - name: Validar
        run: |
          python -c "import json; d=json.load(open('questoes.json',encoding='utf-8')); q=d['questions']; assert len(q)==6000 and d['total']==6000; assert len({x['id'] for x in q})==6000; assert all(x.get('source_package') and x.get('source_pdf') for x in q); print('Banco v32 validado:',len(q))"
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questoes.json audit-question-bank-report.json
          git commit -m "Banco v32: recupera e seleciona 6000 questões" || exit 0
          git push
